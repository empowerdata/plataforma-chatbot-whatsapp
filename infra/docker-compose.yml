# =============================================================================
# Servidor completo num VPS só: Evolution API + Postgres + Redis + Painel + Caddy (HTTPS)
#
#   cp infra/app.env.example infra/app.env          (edite os valores)
#   cp infra/evolution.env.example infra/evolution.env
#   docker compose -f infra/docker-compose.yml up -d
#
# Domínios (apontar DNS para o IP do VPS antes de subir):
#   APP_DOMAIN  → painel (ex.: painel.seudominio.com)
#   EVO_DOMAIN  → Evolution API (ex.: evo.seudominio.com)
# =============================================================================
name: chatbot

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      EVO_DOMAIN: ${EVO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - evolution

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    env_file: ./evolution.env
    environment:
      SERVER_URL: https://${EVO_DOMAIN}
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      CACHE_REDIS_URI: redis://redis:6379/6
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8080"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./app.env
    environment:
      NODE_ENV: production
      APP_URL: https://${APP_DOMAIN}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatbot
      DEV_SIMULATOR: "0"
      # Evolution já vem junto nesta mesma instalação: cadastrada sozinha no
      # boot, sem precisar abrir Admin → Servidores.
      EVOLUTION_BUNDLED_HOST: evolution
      EVOLUTION_BUNDLED_PORT: "8080"
      EVOLUTION_BUNDLED_API_KEY: ${EVOLUTION_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  evolution_instances:
